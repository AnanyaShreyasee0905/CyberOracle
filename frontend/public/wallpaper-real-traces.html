const sigCanvas = document.getElementById('signals');
const sigCtx = sigCanvas.getContext('2d');
const bgImage = document.getElementById('bgImage');

let W, H, DPR;
let scale = 1, offsetX = 0, offsetY = 0;
let activeTraces = [];

function computeCoverMapping(){
  // Mirrors CSS object-fit: cover, object-position: center
  const s = Math.max(W / IMG_W, H / IMG_H);
  const dw = IMG_W * s;
  const dh = IMG_H * s;
  scale = s;
  offsetX = (W - dw) / 2;
  offsetY = (H - dh) / 2;
}

function toScreen(pt){
  return {
    x: offsetX + pt[0] * scale,
    y: offsetY + pt[1] * scale
  };
}

function buildTraces(){
  // Only use paths with a decent number of points / length so motion reads clearly
  const withLength = RAW_PATHS.map(p => {
    let total = 0;
    const segLengths = [];
    for (let i = 1; i < p.length; i++){
      const d = Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
      segLengths.push(d);
      total += d;
    }
    return { points: p, segLengths, total };
  }).filter(t => t.total > 18);

  // Prefer longer traces for the live signals, but keep some variety
  withLength.sort((a,b) => b.total - a.total);
  const chosen = withLength.slice(0, Math.min(48, withLength.length));

  activeTraces = chosen.map(t => ({
    trace: t,
    // Angular speed in radians/ms. A full back-and-forth swing takes
    // roughly 2*PI / speed milliseconds — tuned here to land around 2-4s.
    speed: 0.0016 + Math.random() * 0.0018,
    phase: Math.random() * Math.PI * 2,
    hue: Math.random() < 0.14 ? 'amber' : 'red'
  }));
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  sigCanvas.width = W * DPR;
  sigCanvas.height = H * DPR;
  sigCtx.setTransform(DPR,0,0,DPR,0,0);
  computeCoverMapping();
}

function pointAt(trace, t){
  const target = t * trace.total;
  let acc = 0;
  for (let i = 0; i < trace.segLengths.length; i++){
    const segLen = trace.segLengths[i];
    if (acc + segLen >= target || i === trace.segLengths.length - 1){
      const segT = segLen === 0 ? 0 : (target - acc) / segLen;
      const p0 = trace.points[i];
      const p1 = trace.points[i+1];
      return toScreen([
        p0[0] + (p1[0]-p0[0]) * segT,
        p0[1] + (p1[1]-p0[1]) * segT
      ]);
    }
    acc += segLen;
  }
  return toScreen(trace.points[trace.points.length - 1]);
}

function drawSignals(time){
  sigCtx.clearRect(0,0,W,H);
  sigCtx.globalCompositeOperation = 'lighter';

  activeTraces.forEach(a => {
    // Smooth harmonic oscillation: t swings 0 -> 1 -> 0 -> ... with no jump/reset,
    // easing naturally as it approaches each end (like a pendulum along the trace).
    const angle = (time * a.speed) + a.phase;
    const t = 0.5 - 0.5 * Math.cos(angle);
    const dir = Math.sin(angle) >= 0 ? 1 : -1; // current direction of travel
    const speedFactor = Math.abs(Math.sin(angle)); // 0 at turning points, 1 mid-swing
    const brightness = 0.5 + 0.5 * speedFactor;

    const pos = pointAt(a.trace, t);
    const isAmber = a.hue === 'amber';
    const core = isAmber ? '255,176,32' : '255,50,50';

    const trailSteps = 6;
    for (let i = 0; i < trailSteps; i++){
      const tt = t - dir * i * 0.014;
      if (tt < 0 || tt > 1) continue;
      const tp = pointAt(a.trace, tt);
      const alpha = (1 - i/trailSteps) * brightness * 0.55;
      sigCtx.fillStyle = `rgba(${core},${alpha})`;
      sigCtx.beginPath();
      sigCtx.arc(tp.x, tp.y, 2.3 - i*0.22, 0, Math.PI*2);
      sigCtx.fill();
    }

    sigCtx.shadowColor = `rgba(${core},0.95)`;
    sigCtx.shadowBlur = 11;
    sigCtx.fillStyle = `rgba(${core},${brightness})`;
    sigCtx.beginPath();
    sigCtx.arc(pos.x, pos.y, 2.4, 0, Math.PI*2);
    sigCtx.fill();
    sigCtx.shadowBlur = 0;
  });

  sigCtx.globalCompositeOperation = 'source-over';
}

function loop(time){
  drawSignals(time);
  requestAnimationFrame(loop);
}

resize();

requestAnimationFrame(loop);
